[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "oss-ref"
version = "0.1.0"
description = "Version-pinned OSS source references"
requires-python = ">=3.11"

[project.scripts]
oss-ref = "oss_ref.cli:main"

[tool.pyright]
include = ["oss_ref"]
typeCheckingMode = "strict"
pythonVersion = "3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools]
packages = ["oss_ref"]
